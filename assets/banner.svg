<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6264A7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6264A7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.6" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="brandTeamsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B83EB" />
      <stop offset="100%" stop-color="#5B5FC7" />
    </linearGradient>

    <linearGradient id="accentCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #374151; stroke-opacity: 0.18; stroke-width: 1; }
    .pulse-circle { animation: pulse 6s ease-in-out infinite alternate; }
    .float-slow { animation: float 8s ease-in-out infinite alternate; }
    .float-reverse { animation: floatRev 9s ease-in-out infinite alternate; }
    .flow-line { stroke-dasharray: 8 8; animation: dash 25s linear infinite; }
    .badge-pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #E5E7EB; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.25; }
      100% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes floatRev {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(14px) translateX(-6px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <rect width="1200" height="420" fill="url(#glowPurple)" />
  <rect width="1200" height="420" fill="url(#glowCyan)" />

  <!-- Geometric Grid Background Pattern -->
  <g>
    <line x1="100" y1="0" x2="100" y2="420" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="420" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="420" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="420" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="420" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="420" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="420" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="420" class="grid-line" />
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
  </g>

  <!-- Dynamic Animated Flow Streams in Background -->
  <g opacity="0.35">
    <path d="M 50 320 C 300 390, 500 180, 800 360 C 950 440, 1100 280, 1180 200" fill="none" stroke="#6366F1" stroke-width="2.5" class="flow-line" />
    <path d="M 30 120 C 250 40, 480 250, 750 110 C 920 20, 1080 180, 1170 140" fill="none" stroke="#38BDF8" stroke-width="2" class="flow-line" />
  </g>

  <!-- Floating Dynamic Ecosystem Nodes (Under/Sides of Titles) -->
  <!-- Floating Node 1: Teams Tab -->
  <g class="float-slow" transform="translate(60, 60)">
    <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#4F46E5" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="9" fill="#5B5FC7" />
    <text x="24" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">T</text>
    <text x="44" y="26" class="badge-pill">Teams Embedded</text>
  </g>

  <!-- Floating Node 2: Adaptive Cards -->
  <g class="float-reverse" transform="translate(950, 65)">
    <rect width="185" height="42" rx="21" fill="url(#cardGrad)" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="9" fill="#0284C7" />
    <text x="24" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">⚡</text>
    <text x="44" y="26" class="badge-pill">Adaptive Cards</text>
  </g>

  <!-- Floating Node 3: AI Agents -->
  <g class="float-slow" transform="translate(970, 320)">
    <rect width="165" height="42" rx="21" fill="url(#cardGrad)" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="9" fill="#9333EA" />
    <text x="24" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🤖</text>
    <text x="44" y="26" class="badge-pill">AI Agents & Bots</text>
  </g>

  <!-- Floating Node 4: Webhooks & Graph API -->
  <g class="float-reverse" transform="translate(70, 320)">
    <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="9" fill="#059669" />
    <text x="24" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🔗</text>
    <text x="44" y="26" class="badge-pill">Graph API & Hooks</text>
  </g>

  <!-- Primary Foreground Content (Guaranteed Never Obscured) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 105)">
      <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2" />
      <circle cx="-165" cy="0" r="5" fill="#22C55E">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-148" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#C7D2FE" letter-spacing="0.5">
        CURATED AWESOME ECOSYSTEM • 2026
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="175" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
          font-size="44" 
          font-weight="800" 
          text-anchor="middle" 
          fill="url(#titleGrad)" 
          letter-spacing="-0.8"
          filter="url(#dropGlow)">
      Awesome Collaboration Tool Embedded Apps
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="222" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="20" 
          font-weight="500" 
          text-anchor="middle" 
          fill="#94A3B8" 
          letter-spacing="0.2">
      Enterprise SaaS &amp; Open-Source Extensions for Microsoft Teams, Slack &amp; Workspaces
    </text>

    <!-- Core Technology Tags Bar in Center -->
    <g transform="translate(600, 268)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93C5FD" text-anchor="middle">Microsoft Teams</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-105, 0)">
        <rect x="-60" y="-13" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#A7F3D0" text-anchor="middle">Teams Toolkit</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(45, 0)">
        <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#DDD6FE" text-anchor="middle">Bot Framework</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(205, 0)">
        <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FBCFE8" text-anchor="middle">Enterprise CLM &amp; CRM</text>
      </g>
    </g>
  </g>
</svg>
